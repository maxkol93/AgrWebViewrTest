name: Deploy (Yandex Cloud)

# Два стенда:
#   push в main → прод   (environment: prod)
#   push в dev  → дев    (environment: dev)
# Секреты называются одинаково, значения берутся из соответствующего
# GitHub Environment — поэтому скрипты деплоя одни и те же для обоих стендов.
# Можно запустить и вручную (workflow_dispatch), выбрав стенд.
on:
  push:
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      target:
        description: "Куда деплоить"
        type: choice
        options: [dev, prod]
        default: dev

jobs:
  # Отдельная джоба нужна потому, что `environment:` вычисляется до шагов:
  # так стенд определяется в одном месте, а не дублируется выражением.
  resolve:
    runs-on: ubuntu-latest
    outputs:
      target: ${{ steps.pick.outputs.target }}
    steps:
      - id: pick
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TARGET="${{ inputs.target }}"
          elif [ "${{ github.ref_name }}" = "main" ]; then
            TARGET="prod"
          else
            TARGET="dev"
          fi
          echo "Стенд: $TARGET (ветка ${{ github.ref_name }})"
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"

  deploy:
    needs: resolve
    runs-on: ubuntu-latest
    environment: ${{ needs.resolve.outputs.target }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # полная история — нужна для вычисления патча версии

      - uses: actions/setup-node@v4
        with:
          node-version: "18"

      # ── 1. Сайт → Object Storage ──────────────────────────────────────────
      - name: Установить зависимости загрузчика
        run: npm --prefix deploy install --no-audit --no-fund

      - name: Залить сайт в бакет
        env:
          APP_ENV: ${{ needs.resolve.outputs.target }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          STORAGE_BASE_URL: ${{ secrets.STORAGE_BASE_URL }}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
        run: node deploy/deploy-frontend.mjs

      # ── 2. Логика → Cloud Function ────────────────────────────────────────
      - name: Установить Yandex CLI
        run: |
          curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash -s -- -n -i "$HOME/yc"
          echo "$HOME/yc/bin" >> "$GITHUB_PATH"

      - name: Авторизовать yc
        run: |
          echo '${{ secrets.YC_SA_JSON_CREDENTIALS }}' > sa-key.json
          yc config set service-account-key sa-key.json
          yc config set folder-id ${{ secrets.YC_FOLDER_ID }}

      - name: Обновить Cloud Function
        run: |
          yc serverless function version create \
            --function-name ${{ secrets.YC_FUNCTION_NAME }} \
            --runtime nodejs18 \
            --entrypoint index.handler \
            --memory 256m \
            --execution-timeout 30s \
            --source-path ./backend \
            --environment S3_BUCKET=${{ secrets.S3_BUCKET }} \
            --environment S3_ENDPOINT=https://storage.yandexcloud.net \
            --environment S3_REGION=ru-central1 \
            --environment S3_ACCESS_KEY_ID=${{ secrets.S3_ACCESS_KEY_ID }} \
            --environment S3_SECRET_ACCESS_KEY=${{ secrets.S3_SECRET_ACCESS_KEY }} \
            --environment ADMIN_TOKEN=${{ secrets.ADMIN_TOKEN }}

      - name: Убрать ключ
        if: always()
        run: rm -f sa-key.json

      - name: Итог
        run: |
          # Имя бакета — секрет, в логе оно замаскировано, поэтому URL берём из переменной.
          echo "Стенд ${{ needs.resolve.outputs.target }} обновлён."
          echo "Сайт: ${{ vars.SITE_URL }}"
